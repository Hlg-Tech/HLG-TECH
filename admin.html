<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | HLG-Tech</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: rgba(30, 30, 45, 0.85);
            --neon-blue: #00f2ff;
            --text-color: #ffffff;
            --text-muted: #cccccc;
            --danger: #ff4757;
            --success: #2ed573;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 15px;
        }

        h1 {
            color: var(--text-color);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin: 0 0 5px 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        /* Paneles */
        .panel {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .panel h2 {
            font-size: 1.3em;
            margin-top: 0;
            color: var(--neon-blue);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #181828;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 242, 255, 0.3);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-blue);
            color: #0f0f1a;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Tabla de Productos */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9em;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            color: var(--neon-blue);
            font-weight: 600;
        }

        .product-img {
            width: 45px;
            height: 45px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 6px;
        }

        .badge-visible {
            color: var(--success);
            font-weight: bold;
        }

        .badge-hidden {
            color: var(--danger);
            font-weight: bold;
        }

        #loader-admin {
            text-align: center;
            padding: 20px;
            color: var(--neon-blue);
        }

        /* Adaptación para pantallas pequeñas */
        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>HLG-Tech</h1>
        <p style="margin: 0; color: var(--text-muted);">Backoffice - Gestión de Inventario</p>
    </header>

    <div class="container">
        
        <!-- Panel Izquierdo: Formulario para Agregar Producto -->
        <section class="panel">
            <h2>➕ Agregar Producto</h2>
            <form id="formProducto">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="nombre" required placeholder="Ej: Monitor Gaming 24''">
                </div>

                <div class="form-group">
                    <label>Precio ($)</label>
                    <input type="number" id="precio" step="0.01" required placeholder="Ej: 180.00">
                </div>

                <div class="form-group">
                    <label>Stock Inicial</label>
                    <input type="number" id="stock" required placeholder="Ej: 5">
                </div>

                <div class="form-group">
                    <label>Categoría</label>
                    <input type="text" id="categoria" required placeholder="Ej: Monitores">
                </div>

                <div class="form-group">
                    <label>URL de la Imagen (Cloudinary)</label>
                    <input type="url" id="imagen_url" required placeholder="https://res.cloudinary.com/...">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Detalles técnicos..."></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="mostrar" checked>
                    <label for="mostrar" style="margin:0; cursor:pointer;">Mostrar en catálogo inmediatamente</label>
                </div>

                <button type="submit" class="btn-submit" id="btnGuardar">Guardar Producto</button>
            </form>
        </section>

        <!-- Panel Derecho: Tabla de Productos Activos -->
        <section class="panel">
            <h2>📦 Catálogo en Hoja de Cálculo</h2>
            <div id="loader-admin">Cargando productos...</div>
            <div class="table-wrapper">
                <table id="tablaProductos" style="display: none;">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyProductos">
                        <!-- Las filas se renderizan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        // ⚠️ PEGA AQUÍ LA URL DE TU WEBP APP DE GOOGLE APPS SCRIPT:
        const API_URL = 'https://script.google.com/macros/s/AKfycbzvCBVH7U09omoEz3oQYIFbQzqOrl_0Jz2-KORgRiAPsB-qgM0Is_ChzzOkzm54ASK6/exec';

        // 1. Cargar productos en la tabla al entrar
        async function cargarTablaAdmin() {
            const loader = document.getElementById('loader-admin');
            const tabla = document.getElementById('tablaProductos');
            const tbody = document.getElementById('tbodyProductos');

            try {
                loader.style.display = 'block';
                tabla.style.display = 'none';

                const res = await fetch(API_URL);
                const productos = await res.json();

                tbody.innerHTML = '';

                productos.forEach(p => {
                    const esVisible = String(p.Mostrar).toUpperCase() === 'TRUE' || p.Mostrar === true || p.Mostrar === 'Si';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${p.Imagen_URL}" class="product-img" alt="Foto"></td>
                        <td><strong>${p.Nombre}</strong></td>
                        <td>$${p.Precio}</td>
                        <td>${p.Stock}</td>
                        <td>${p.Categoria}</td>
                        <td><span class="${esVisible ? 'badge-visible' : 'badge-hidden'}">${esVisible ? 'VisiblE' : 'Oculto'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                loader.style.display = 'none';
                tabla.style.display = 'table';
            } catch (error) {
                loader.innerText = 'Error al cargar los datos desde Google Sheets.';
            }
        }

        // 2. Enviar nuevo producto a la API
        document.getElementById('formProducto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerText = 'Guardando en Google Sheets...';

            const nuevoProducto = {
                action: 'agregar',
                Nombre: document.getElementById('nombre').value,
                Precio: document.getElementById('precio').value,
                Stock: document.getElementById('stock').value,
                Categoria: document.getElementById('categoria').value,
                Mostrar: document.getElementById('mostrar').checked ? 'TRUE' : 'FALSE',
                Imagen_URL: document.getElementById('imagen_url').value,
                Descripcion: document.getElementById('descripcion').value
            };

            try {
                // Apps Script requiere el método POST enviando un cuerpo JSON plano
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Evita problemas de CORS con Apps Script al escribir
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });

                alert('¡Producto enviado correctamente!');
                document.getElementById('formProducto').reset();
                document.getElementById('mostrar').checked = true;

                // Esperamos un segundo a que Google Sheets procese la fila y recargamos la tabla
                setTimeout(cargarTablaAdmin, 1500);

            } catch (error) {
                alert('Error al guardar el producto.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Guardar Producto';
            }
        });

        // Inicializar
        cargarTablaAdmin();
    </script>
</body>
</html>
