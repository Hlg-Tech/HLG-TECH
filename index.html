<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HLG-Tech | Laptops y PC en Holguín</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; }
        header { background: #1a1a1a; color: white; padding: 20px; text-align: center; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; border-radius: 4px; height: 200px; object-fit: cover; }
        .precio { color: #007bff; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>HLG-Tech</h1>
        <p>Tecnología de alto rendimiento en Holguín</p>
    </header>

    <div id="app" class="grid-productos">
        <p>Cargando productos...</p>
    </div>

    <script>
        const API_URL = 'https://sheetdb.io/api/v1/315mpve04cyog';

        async function cargarProductos() {
            try {
                const respuesta = await fetch(API_URL);
                const productos = await respuesta.json();
                const contenedor = document.getElementById('app');
                contenedor.innerHTML = ''; 

                productos.forEach(p => {
                    // ... dentro de tu ciclo forEach
if (p.Estado.toLowerCase() === 'disponible') {
    contenedor.innerHTML += `
        <div class="card">
            <img src="${p.Imagen_URL}" alt="${p.Nombre}">
            <h3>${p.Nombre}</h3>
            <!-- La línea de Ref: ${p.Código} ha sido eliminada de aquí para limpieza visual -->
            <p class="specs">${p.Especificaciones}</p>
            <div class="precio">$${p.Precio}</div>
            <p><small>Stock: ${p.Stock}</small></p>
            <button onclick="window.location.href='https://wa.me/5350110410?text=Hola, me interesa el producto ${p.Nombre} (Ref: ${p.Código})'">Consultar</button>
        </div>
    `;
}
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('app').innerHTML = '<p>Error al cargar productos.</p>';
            }
        }

        cargarProductos();
    </script>
</body>
</html>
